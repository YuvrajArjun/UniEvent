{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}UniEvents — The Heartbeat of Campus Experiences{% endblock %}</title>
  <meta name="description" content="{% block description %}Discover intercollegiate and intracollegiate events across partner campuses, register in a few taps, or take your own event from proposal to public listing.{% endblock %}" />
  <link rel="icon" type="image/png" href="{% static 'assets/unievents-favicon.png' %}" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,450;9..144,560;9..144,650;9..144,720&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/styles.css' %}?v=1.3" />
  {% block extra_head %}{% endblock %}
</head>
<body>
  <div id="page-loader">
    <img src="{% static 'assets/unievents-full.png' %}" alt="UniEvents" />
    <div class="loader-bar"></div>
  </div>

  <header id="app-header"></header>

  <main{% block main_attrs %}{% endblock %}>
    {% block content %}{% endblock %}
  </main>

  <div id="app-footer"></div>

  <script>window.UNIEVENTS_API_BASE = "/api";</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
  <script src="{% static 'js/utils.js' %}"></script>
  <script src="{% static 'js/api.js' %}"></script>
  <script src="{% static 'js/effects.js' %}"></script>
  <script src="{% static 'js/nav.js' %}?v=1.3"></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
