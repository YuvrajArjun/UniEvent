databases:
  - name: unievents_db
    databaseName: unievents
    user: unievents
    region: oregon

services:
  - type: web
    name: unievents
    runtime: python
    runtimeVersion: 3.11.5
    plan: free
    region: oregon
    buildCommand: >
      pip install -r requirements.txt && 
      python manage.py migrate && 
      python manage.py seed_data && 
      python manage.py collectstatic --noinput
    startCommand: gunicorn unievents_project.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: unievents_db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*.render.com"
      - key: PYTHONUNBUFFERED
        value: "True"
