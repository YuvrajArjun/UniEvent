services:
  mysql:
    image: mysql:8.0
    container_name: unievents-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: unievents
      MYSQL_USER: unievents
      MYSQL_PASSWORD: unievents_pw
    ports:
      - "3307:3306"
    volumes:
      - unievents_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  unievents_mysql_data:
